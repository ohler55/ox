name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:

permissions:
  contents: read

jobs:
  Build:
    strategy:
      fail-fast: true
      matrix:
        # Due to https://github.com/actions/runner/issues/849, we have to use quotes for '3.0'
        ruby:
          - head
          - '4.0'
          - '3.4'
          - '3.3'
          - '3.2'
          - '3.1'
          - '3.0'
          - '2.7'
        os:
          - ubuntu
          - macos
          - windows
        exclude:
          - { os: ubuntu, ruby: '3.1' }
          - { os: ubuntu, ruby: '3.0' }
          - { os: ubuntu, ruby: '2.7' }
        # ARM64 runners, which have no -latest label. setup-ruby has Windows
        # ARM64 builds from Ruby 3.4 (RubyInstaller's first).
        include:
          - { os: ubuntu-arm, runner: ubuntu-26.04-arm, ruby: '4.0' }
          - { os: windows-arm, runner: windows-11-arm, ruby: head }
          - { os: windows-arm, runner: windows-11-arm, ruby: '4.0' }
          - { os: windows-arm, runner: windows-11-arm, ruby: '3.4' }

    runs-on: ${{ matrix.runner || format('{0}-latest', matrix.os) }}
    timeout-minutes: 20
    continue-on-error: ${{ matrix.ruby == '3.0' || matrix.ruby == 'head'}}
    name: Ruby ${{ matrix.ruby }} (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake
